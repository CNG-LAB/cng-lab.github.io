<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NEUROSONICS</title>
  <style>
    @font-face {
      font-family: 'Avenir';
      src: local('Avenir'), local('Avenir Heavy'), local('Avenir-Heavy');
      font-weight: 900;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: black;
      color: #eee;
      font-family: 'Avenir', 'Helvetica Neue', Arial, sans-serif;
      font-weight: 100;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    .page-wrapper {
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-bottom: 40px;
    }

    .page-title {
      font-family: 'Avenir', sans-serif;
      font-weight: 900;
      font-size: 3rem;
      color: #fff;
      text-align: center;
      margin: 20px 0 30px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      width: 90vw;
      max-width: 1200px;
    }

    .video-container {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1; /* makes square boxes */
      overflow: hidden;
      border-radius: 8px;
      box-shadow: 0 0 8px rgba(0,0,0,0.6);
    }

    .video-container video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      cursor: pointer;
      transition: transform 0.3s ease;
      display: block;
    }

    .video-container video:hover {
      transform: scale(1.03);
      box-shadow: 0 0 16px rgba(255,255,255,0.25);
    }

    .artist-labels {
      position: fixed;
      bottom: 60px;
      right: 20px;
      text-align: right;
      font-size: 0.9rem;
      font-weight: 100;
      color: #666;
      line-height: 1.5;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-family: 'Avenir', 'Helvetica Neue', sans-serif;
      max-width: 200px;
      user-select: none;
      transition: color 0.3s ease, text-shadow 0.3s ease;
    }

    .artist-labels .artist {
      cursor: default;
      margin-top: 6px;
    }

    .artist-labels .artist.highlight {
      color: #fff;
      font-weight: 700;
      text-shadow: 0 0 8px #fff;
    }

    footer {
      padding: 20px 0;
      text-align: center;
    }

    .footerLinks a {
      color: #ccc;
      font-size: 0.85rem;
      text-decoration: none;
    }

    @media (max-width: 600px) {
      .page-title {
        font-size: 2rem;
      }

      .artist-labels {
        font-size: 0.75rem;
        bottom: 80px;
      }
    }
  </style>
</head>

<body>
  <div class="page-wrapper">
    <div class="main-content">
      <h1 class="page-title">NEUROSONICS</h1>

      <div class="video-grid">
        <div class="video-container"><video src="videos/hipp_merel.mp4" controls></video></div>
        <div class="video-container"><video src="videos/hyrogenpart1_dvd.mp4" controls></video></div>
        <div class="video-container"><video src="videos/cereb_knolk.mp4" controls></video></div>
        <div class="video-container"><video src="videos/brainstat_orbit_opt.mp4" controls></video></div>
        <div class="video-container"><video src="videos/neumann_transmissions.mp4" controls></video></div>
      </div>
    </div>

    <footer>
      <div class="footerLinks">
        <a href="impressum_kiosk.html">Impressum</a>
      </div>
    </footer>
  </div>

  <div class="artist-labels">
    In collaboration with: <br />
    <div class="artist" data-artist="martin-panitz">Martin Panitz</div>
    <div class="artist" data-artist="natural-philosophy">Natural-philosophy with Attitude</div>
    <div class="artist" data-artist="nufa">NUFA & Şeyma Bayrak</div>
    <div class="artist" data-artist="julian-wolf">Julian-Wolf Neumann</div>
  </div>

  <script>
    const artistMap = {
      0: ['martin-panitz'],
      1: ['natural-philosophy'],
      2: ['martin-panitz'],
      3: ['nufa'],
      4: ['julian-wolf'],
    };

    const artists = document.querySelectorAll('.artist');
    const videos = document.querySelectorAll('.video-grid video');

    function clearHighlights() {
      artists.forEach(a => a.classList.remove('highlight'));
    }

    videos.forEach((video, idx) => {
      video.addEventListener('play', () => {
        clearHighlights();
        const artistKeys = artistMap[idx] || [];
        artistKeys.forEach(key => {
          const artistElem = document.querySelector(`.artist[data-artist="${key}"]`);
          if (artistElem) artistElem.classList.add('highlight');
        });
      });

      video.addEventListener('pause', clearHighlights);
      video.addEventListener('ended', clearHighlights);

      // On click, request fullscreen (mobile)
      video.addEventListener('click', () => {
        if (video.requestFullscreen) {
          video.requestFullscreen();
        } else if (video.webkitEnterFullscreen) {
          video.webkitEnterFullscreen(); // iOS
        } else if (video.msRequestFullscreen) {
          video.msRequestFullscreen();
        }
      });
    });
  </script>
</body>
</html>
