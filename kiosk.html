<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NEUROSONIC</title>
  <style>
    @font-face {
      font-family: 'Avenir';
      src: local('Avenir'), local('Avenir Heavy'), local('Avenir-Heavy');
      font-weight: 900;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: black;
      color: #eee;
      font-family: 'Avenir', 'Helvetica Neue', Arial, sans-serif;
      font-weight: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .page-title {
      font-family: 'Avenir', sans-serif;
      font-weight: 900;
      font-size: 3rem;
      color: #fff;
      text-align: center;
      margin: 40px 0 20px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      width: 90vw;
      max-width: 1200px;
    }

    video {
      width: 100%;
      height: 370px;
      object-fit: cover;
      background: black;
      cursor: pointer;
      border-radius: 8px;
      outline: none;
      transition: transform 0.3s ease;
    }

    video:hover {
      transform: scale(1.01);
    }

    video::-webkit-media-controls {
      display: none !important;
    }

    .artist-labels {
      position: fixed;
      bottom: 20px;
      right: 20px;
      text-align: right;
      font-size: 0.9rem;
      font-weight: 100;
      color: #ccc;
      line-height: 1.5;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-family: 'Avenir', 'Helvetica Neue', sans-serif;
    }
  </style>
</head>
<body>
  <h1 class="page-title">NEUROSONIC</h1>

  <div class="video-grid">
    <video src="videos/output_small.mp4" controls></video>
    <video src="videos/output2.mp4" controls></video>
    <video src="videos/hyrogenpart1_dvd.mp4" controls></video>
  </div>

  <div class="artist-labels">
    Martin Panitz<br />
    Martin Panitz<br />
    Natural Philosophers with Attitude
  </div>

  <script>
    const videos = document.querySelectorAll('video');
    videos.forEach((video, idx) => {
      video.addEventListener('play', () => {
        videos.forEach((v, i) => {
          if (i !== idx) v.pause();
        });
      });
      video.addEventListener('click', () => {
        if (video.requestFullscreen) {
          video.requestFullscreen();
        } else if (video.webkitRequestFullscreen) {
          video.webkitRequestFullscreen();
        } else if (video.msRequestFullscreen) {
          video.msRequestFullscreen();
        }
      });
    });
  </script>
</body>
</html>
