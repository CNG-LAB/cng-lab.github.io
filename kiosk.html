<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NEUROSONIC</title>
  <style>
    @font-face {
      font-family: 'Avenir';
      src: local('Avenir'), local('Avenir Heavy'), local('Avenir-Heavy');
      font-weight: 900;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: black;
      color: #eee;
      font-family: 'Avenir', 'Helvetica Neue', Arial, sans-serif;
      font-weight: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .page-title {
      font-family: 'Avenir', sans-serif;
      font-weight: 900;
      font-size: 3rem;
      color: #fff;
      text-align: center;
      margin: 40px 0 20px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      width: 90vw;
      max-width: 900px;
    }

    .video-grid iframe {
      width: 100%;
      height: 370px;
      border: none;
      border-radius: 8px;
    }

    .artist-labels {
      position: fixed;
      bottom: 20px;
      right: 20px;
      text-align: right;
      font-size: 0.9rem;
      font-weight: 100;
      color: #ccc;
      line-height: 1.5;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-family: 'Avenir', 'Helvetica Neue', sans-serif;
    }
  </style>
</head>
<body>
  <h1 class="page-title">NEUROSONIC</h1>

  <div class="video-grid">
    <iframe src="https://player.vimeo.com/video/1098294517" allow="fullscreen; picture-in-picture" allowfullscreen></iframe>
    <iframe src="https://player.vimeo.com/video/VIDEO_ID_2" allow="fullscreen; picture-in-picture" allowfullscreen></iframe>
    <iframe src="https://player.vimeo.com/video/1098294483" allow="fullscreen; picture-in-picture" allowfullscreen></iframe>
    <iframe src="https://player.vimeo.com/video/1098293854" allow="fullscreen; picture-in-picture" allowfullscreen></iframe>
  </div>

  <div class="artist-labels">
    Martin Panitz<br />
    Natural Philosophers with Attitude<br />
    Wolf-Julian Neumann
  </div>
</body>
</html>
